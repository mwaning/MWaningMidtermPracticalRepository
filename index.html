<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash Zone Tickets</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="ticketBox">
      <div class="innerText">
        <div class="titleText">
          <p class="title">Splash Zone Tickets</p>
        </div>
        <p class="instructionText">
          Enter your name and age to see your ticket price.
        </p>
        <p class="inputText">Name:</p>
        <div class="inputDiv">
          <input type="text" name="nameInput" id="nameInput" />
        </div>
        <p class="inputText">Age:</p>
        <div class="inputDiv">
          <input type="text" name="ageInput" id="ageInput" />
        </div>
        <div class="btnDiv">
          <button id="ticketBtn">Get My Ticket</button>
        </div>
        <p class="finalMessage" id="finalMessage"></p>
      </div>
    </div>

    <script src="app/app.js"></script>
  </body>
</html>
